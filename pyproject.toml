[project]
name = "practice-git-intro-to-github-actions"
version = "0.1.0"
description = "Intro to GitHub Actions: a worked-example learning curriculum"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.32",
]

[dependency-groups]
core = [
  "jupyter>=1.1.1",
  "nbconvert>=7.16.4",
  "nbformat>=5.10.4",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intro_gha"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "sandbox/tally/tests"]
addopts = "-q"
pythonpath = ["src", "sandbox/tally"]

[tool.ruff.lint.per-file-ignores]
"src/intro_gha/chapters.py" = ["E501"]
"scripts/build_readme.py" = ["E501"]
