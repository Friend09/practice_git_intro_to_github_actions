name: ch20 reusable oidc (called)

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: ubuntu-latest
    env:
      AUD: sts.amazonaws.com
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Decode the OIDC token issued inside a called workflow
        run: |
          python3 -m pip install --quiet "pyjwt[crypto]"
          python3 - <<'PY'
          import json, os, urllib.request
          import jwt

          aud = os.environ["AUD"]
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=" + aud
          req = urllib.request.Request(
              url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]}
          )
          token = json.load(urllib.request.urlopen(req))["value"]
          key = jwt.PyJWKClient(os.environ["ISSUER"] + "/.well-known/jwks").get_signing_key_from_jwt(token).key
          claims = jwt.decode(token, key, algorithms=["RS256"], audience=aud, issuer=os.environ["ISSUER"])
          for name in ("sub", "job_workflow_ref", "workflow_ref", "workflow", "event_name", "ref"):
              print(f"REPORT oidc_{name}={claims.get(name)}")
          PY
