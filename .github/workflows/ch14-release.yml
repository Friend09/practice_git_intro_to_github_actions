name: ch14 release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v (for example 0.1.1)'
        required: true
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Work out and validate the version
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "push" ]; then v="${REF_NAME#v}"; else v="$INPUT_VERSION"; fi
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error title=Not a semantic version::'$v' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "REPORT event=$EVENT version=$v tag=v$v"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Stamp the version and build
        working-directory: sandbox/tally
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python -m pip install --quiet build
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          python -m build
          echo "REPORT built=$(find dist -type f -printf '%f ' | sort | tr -s ' ')"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: sandbox/tally/dist/
          retention-days: 1

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Checksums
        working-directory: dist
        run: sha256sum ./* > SHA256SUMS

      - name: Create the release
        run: |
          flags=(--title "Tally $VERSION" --generate-notes --target "$GITHUB_SHA")
          prev=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate -q '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | grep -vx "$TAG" | sort -V | tail -1 || true)
          if [ -n "$prev" ]; then flags+=(--notes-start-tag "$prev"); fi
          echo "REPORT notes_start_tag=${prev:-none}"
          if [ "$EVENT" = "push" ] || [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* "${flags[@]}" --repo "$GITHUB_REPOSITORY"
          echo "REPORT release_created=$TAG assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '[.assets[].name]|join(",")')"

  publish_pypi_guarded:
    needs: [build]
    if: ${{ vars.GHA_ENABLE_PYPI == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
