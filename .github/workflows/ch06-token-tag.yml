name: ch06 token tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to create with GITHUB_TOKEN'
        required: true
        default: demo-v-token

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create and push a tag using GITHUB_TOKEN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "REPORT pushed tag $TAG with GITHUB_TOKEN"
