name: ch16 attest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.d.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Build the wheel
        working-directory: sandbox/tally
        run: |
          python -m pip install --quiet build
          python -m build --wheel
      - name: Record the wheel digest
        id: d
        run: echo "digest=sha256:$(sha256sum sandbox/tally/dist/*.whl | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sandbox/tally/dist/*.whl
      - run: |
          echo "REPORT attested=yes attestation_id_set=${ID:+yes} digest=$DIGEST"
        env:
          ID: ${{ steps.attest.outputs.attestation-id }}
          DIGEST: ${{ steps.d.outputs.digest }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: attested-wheel
          path: sandbox/tally/dist/*.whl
          retention-days: 1

  verify:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: attested-wheel
          path: pkg/
      - name: Verify the genuine wheel
        run: |
          whl=$(find pkg -name '*.whl' | head -1)
          got="sha256:$(sha256sum "$whl" | cut -d' ' -f1)"
          echo "REPORT digest_matches_build=$([ "$got" = "$EXPECTED" ] && echo yes || echo no)"
          if gh attestation verify "$whl" --repo "$GITHUB_REPOSITORY" --format json > verify.json 2> verify.err; then
            echo "REPORT genuine_verify=ok predicate=$(jq -r '.[0].verificationResult.statement.predicateType' verify.json) signer=$(jq -r '.[0].verificationResult.signature.certificate.subjectAlternativeName' verify.json | sed 's|https://github.com/||')"
          else
            echo "REPORT genuine_verify=FAILED"; cat verify.err
          fi
      - name: Tamper with the wheel and verify again
        run: |
          whl=$(find pkg -name '*.whl' | head -1)
          printf 'x' >> "$whl"
          if gh attestation verify "$whl" --repo "$GITHUB_REPOSITORY" > /dev/null 2> tamper.err; then
            echo "REPORT tampered_verify=ok-UNEXPECTED"
          else
            echo "REPORT tampered_verify=rejected msg=$(head -c 160 tamper.err | tr '\n' ' ' | tr ' ' '_')"
          fi
