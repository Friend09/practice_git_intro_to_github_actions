name: ch21 github-script

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'sandbox/ch21/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Post or update one comment on the pull request
        id: bot
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        with:
          script: |
            const marker = '<!-- ch21-tally-bot -->';
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number });
            const body = marker + '\n**Tally bot:** this PR changes ' + files.length + ' file(s): ' +
              files.map((f) => f.filename).join(', ') + '\n\nTitle (read from env, not interpolated): ' + process.env.PR_TITLE;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number });
            const mine = comments.find((c) => c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
              core.setOutput('action', 'updated');
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
              core.setOutput('action', 'created');
            }
            core.setOutput('files', String(files.length));
            core.setOutput('node', process.version);
      - name: Report
        env:
          ACTION: ${{ steps.bot.outputs.action }}
          FILES: ${{ steps.bot.outputs.files }}
          NODE: ${{ steps.bot.outputs.node }}
        run: echo "REPORT github_script action=$ACTION files=$FILES node=$NODE"
