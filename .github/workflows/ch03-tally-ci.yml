name: ch03 tally ci
run-name: Tally CI (fail=${{ inputs.fail || false }}) by ${{ github.actor }}

on:
  push:
    paths:
      - 'sandbox/**'
      - '.github/workflows/ch03-tally-ci.yml'
  workflow_dispatch:
    inputs:
      fail:
        description: 'Break add() first to produce a red run'
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: sandbox/tally
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pytest
        run: python -m pip install pytest

      - name: Break add() on purpose
        if: ${{ inputs.fail }}
        run: sed -i 's/return a + b/return a - b/' tally/add.py

      - name: Run tests
        run: python -m pytest -v
