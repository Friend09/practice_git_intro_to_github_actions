name: ch02 no checkout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Files in workspace BEFORE checkout
        run: |
          echo "count=$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 | wc -l)"
          test -f pyproject.toml && echo "pyproject.toml: present" || echo "pyproject.toml: MISSING"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Files in workspace AFTER checkout
        run: |
          echo "count=$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 | wc -l)"
          test -f pyproject.toml && echo "pyproject.toml: present" || echo "pyproject.toml: MISSING"
