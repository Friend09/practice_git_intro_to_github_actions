name: ch16 tag object sha (probe)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag_object_sha:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # a892a5a6... is the annotated TAG OBJECT for v1.14.2, not the commit
      - uses: pypa/gh-action-pypi-publish@2442bad8f54b06a326f3030ef5e6a7a674118557
        with:
          packages-dir: does-not-exist/

  commit_sha:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # dc37677b... is the commit the tag points at
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: does-not-exist/
